<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foosha Village Luffy Game</title>
    <style>
      :root {
        --bg: #08131f;
        --panel: #112334;
        --panel-alt: #17344b;
        --accent: #ffbf47;
        --accent-2: #5ad1ff;
        --text: #edf7ff;
        --muted: #b2d8ee;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #163857 0%, var(--bg) 52%);
        color: var(--text);
        display: grid;
        place-items: center;
      }

      .card {
        width: min(720px, calc(100vw - 32px));
        background: rgba(17, 35, 52, 0.95);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        box-shadow: 0 20px 50px var(--shadow);
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.1;
        color: var(--accent);
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 24px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #ff9f1c);
        color: #1d1708;
      }

      .secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.2);
      }

      .info {
        margin-top: 24px;
        padding: 14px 16px;
        border-left: 4px solid var(--accent-2);
        background: rgba(90, 209, 255, 0.08);
        color: var(--text);
        border-radius: 10px;
      }

      code {
        background: rgba(255,255,255,0.05);
        padding: 2px 8px;
        border-radius: 6px;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Foosha Village Luffy Game</h1>
      <p>
        This project has been prepared for static hosting. The original game is packaged as a ZIP file and is ready to be downloaded and opened locally.
      </p>

      <div class="actions">
        <a class="btn primary" href="./foosha-village-luffy-game.zip" download>Download ZIP</a>
        <a class="btn secondary" href="./foosha-village-luffy-game.zip">Open ZIP</a>
      </div>

      <div class="info">
        To play: download the ZIP, extract it, and open <code>foosha-game/index.html</code> in a browser.
      </div>
    </main>
  </body>
</html>
